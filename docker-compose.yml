services:
  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    image: ecommerce-pulse-generator:latest
    container_name: ecommerce-pulse-generator
    networks:
      - kafka_net
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093

  kafka:
    image: apache/kafka:4.3.1
    container_name: ecommerce-pulse-kafka
    hostname: kafka
    networks:
      - kafka_net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: HOST://:9092,DOCKER://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: ecommerce-pulse-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka_net
    volumes:
      - ./docker/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    entrypoint: [ "/bin/bash", "/scripts/init-topics.sh" ]
    restart: "no"

networks:
  kafka_net:
    driver: bridge