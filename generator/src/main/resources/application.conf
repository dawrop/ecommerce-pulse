generator {
  users = 1000
  products = 1000
  seed = 42

  kafka {
    events-topic: "events"
  }
}

pekko.kafka.producer {
  parallelism = 100
  close-timeout = 30s
  close-on-producer-stop = true

  kafka-clients {
    bootstrap.servers = "kafka:9093"

    acks = "all"
    enable.idempotence = true
    delivery.timeout.ms = 120000
    request.timeout.ms = 30000
  }
}
